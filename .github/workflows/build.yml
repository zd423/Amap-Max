name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        shell: pwsh
        run: |
          sdkmanager "platforms;android-31" "build-tools;34.0.0" "platform-tools"
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Write-Host "JAVA_HOME=$env:JAVA_HOME"

      - name: Build APK
        shell: pwsh
        run: ./build-ci.ps1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMapMax-apk
          path: package/*.apk
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ github.sha }}
          name: AMapMax CI ${{ github.run_number }} (${{ github.sha }})
          body: |
            自动构建 APK。

            - 构建号: ${{ github.run_number }}
            - 提交: ${{ github.sha }}
            - 分支: ${{ github.ref }}
          files: package/*.apk
          draft: false
          prerelease: true
